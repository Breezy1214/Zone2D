[package]
name = "breezy1214/zone2d"
description = "Lightweight part-footprint zones with Entered/Exited signals, an optional height cap, and above-only mode."
version = "0.1.0"
license = "MIT"
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
exclude = [
	"Packages",
	"dev.project.json",
	"moonwave.toml",
	"sourcemap.json",
	"rokit.toml",
	"selene.toml",
	"stylua.toml",
]

[dependencies]
Janitor = "howmanysmall/janitor@1.18.3"
Signal = "sleitnick/signal@2.0.1"
